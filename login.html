<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - xyz gym</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            color: #333;
            line-height: 1.6;
            background-color: #111;
        }

        /* Header & Navigation */
        header {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            border-bottom: 2px solid #e0e0e0;
            height: 70px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 24px;
            color: #111;
        }

        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            font-weight: 500;
        }

        .cta-nav-btn {
            background-color: #d90429;
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            border: 3px solid #d90429;
            transition: background-color 0.2s ease;
        }

        .cta-nav-btn:hover {
            background-color: #b10320;
            border-color: #b10320;
            color: #fff;
        }

        /* Main Container with Background Image */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px); 
            padding: 20px;

            /* Dark overlay + Your Gym Background Image */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url("loginbackground.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* Modern Dark Glassmorphism Card */
        form {
            width: 100%;
            max-width: 380px;
            /* Semi-transparent dark background with subtle blur */
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 35px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        form h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #ffffff;
            font-size: 26px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #e0e0e0;
        }

        /* Metallic Gray Input Styling matching Chrome Dumbbells */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #888;
        }

        /* Focus State with Red Accent Border */
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #d90429;
            background-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 8px rgba(217, 4, 41, 0.4);
        }

        /* Red Accent Submit Button */
        .submit-btn {
            width: 100%;
            background-color: #d90429;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #b10320;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <header>
        <h1>xyz gym</h1>
        <nav>
            <ul>
                <li><a href="index.html" class="cta-nav-btn">Home</a></li>
                <li><a href="signup.html" class="cta-nav-btn">Signup</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form id="login-form">
            <h2>Member Login</h2>
            
            <div class="input-group">
                <label for="username">User ID / Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your ID" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="submit-btn">Log In</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
