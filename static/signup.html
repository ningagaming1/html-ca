<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Titans Fitness Studio</title>
    <meta name="description" content="Create your Titans Fitness Studio account and start your fitness journey today.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ── Design Tokens ── */
        :root {
            --red:    #ef233c;
            --crimson:#d80032;
            --slate:  #8d99ae;
            --light:  #edf2f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--light);
            overflow-x: hidden;
        }

        /* ── Blurred Gym Background ── */
        body::before {
            content: "";
            position: fixed;
            inset: -15px;
            z-index: -1;
            background: linear-gradient(180deg, rgba(0,0,0,0.38) 0%, rgba(0,0,0,0.75) 100%),
                        url("background.jpg") center/cover no-repeat;
            filter: blur(5px);
            transform: scale(1.04);
        }

        /* ── Header ── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: rgba(17, 21, 28, 0.5);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(237, 242, 244, 0.12);
        }
        header h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        header h1 span { color: var(--red); }

        nav ul { display: flex; gap: 16px; list-style: none; align-items: center; }
        .nav-link {
            text-decoration: none;
            color: var(--light);
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--red); }

        .nav-btn {
            background: var(--crimson);
            color: var(--light);
            text-decoration: none;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 18px;
            transition: background 0.25s, transform 0.25s;
        }
        .nav-btn:hover { background: var(--red); transform: translateY(-1px); }

        /* ── Main ── */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .auth-container {
            width: 100%;
            max-width: 320px;
            text-align: center;
            /* Card slides up on page load */
            animation: slideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .auth-container h2 {
            font-size: 26px;
            font-weight: 800;
            text-shadow: 0 3px 12px rgba(0,0,0,0.65);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: rgba(237, 242, 244, 0.88);
            font-size: 12px;
            margin-bottom: 18px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        /* ── Input Fields ── */
        .input-group { margin-bottom: 11px; text-align: left; }

        label {
            display: block;
            margin-bottom: 4px;
            margin-left: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 9px 16px;
            font-size: 13px;
            color: #111827;
            background: rgba(237, 242, 244, 0.94);
            border: 1.5px solid transparent;
            border-radius: 20px;
            outline: none;
            box-shadow: 0 6px 16px rgba(0,0,0,0.32);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input::placeholder { color: var(--slate); font-size: 12px; }

        input[type="text"]:hover,
        input[type="email"]:hover,
        input[type="password"]:hover {
            background: #fff;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.38);
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            background: #fff;
            border-color: var(--red);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(239, 35, 60, 0.42);
        }

        /* ── Inline Error Message ── */
        /* Shown when the two password fields don't match */
        .error-msg {
            font-size: 11px;
            font-weight: 700;
            color: #ff6b81;
            margin-top: 4px;
            margin-left: 12px;
            display: none;       /* hidden by default */
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        /* ── Terms Checkbox ── */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 14px 6px;
            text-align: left;
        }
        .checkbox-group input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            min-width: 16px;
            margin-top: 2px;
            border-radius: 4px;
            background: rgba(237, 242, 244, 0.92);
            border: 1.5px solid var(--slate);
            cursor: pointer;
            display: grid;
            place-content: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
            transition: all 0.2s;
        }
        .checkbox-group input[type="checkbox"]:checked {
            background: var(--crimson);
            border-color: var(--red);
        }
        .checkbox-group input[type="checkbox"]:checked::before {
            content: "✓"; color: #fff; font-size: 11px; font-weight: 800;
        }
        .checkbox-group label {
            display: inline;
            margin: 0;
            font-size: 11px;
            font-weight: 600;
            text-transform: none;
            letter-spacing: normal;
            line-height: 1.4;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            cursor: pointer;
        }
        .checkbox-group label a { color: #ff758f; text-decoration: underline; transition: color 0.2s; }
        .checkbox-group label a:hover { color: var(--light); }

        /* ── Submit Button ── */
        .submit-btn {
            width: 100%;
            margin-top: 4px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--light);
            background: linear-gradient(135deg, var(--red), var(--crimson));
            border: none;
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(216, 0, 50, 0.45);
            transition: all 0.25s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(216, 0, 50, 0.55);
            background: linear-gradient(135deg, #ff3b53, var(--crimson));
        }
        .submit-btn:active { transform: translateY(0); }

        /* ── Footer Link ── */
        .auth-footer {
            margin-top: 16px;
            font-size: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .auth-footer a {
            color: #ff758f;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
            transition: color 0.2s;
        }
        .auth-footer a:hover { color: var(--light); text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>Titans <span>Fitness Studio</span></h1>
        <nav>
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="login.html" class="nav-btn">Log In</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h2>Join the Titans</h2>
            <p class="subtitle">Start your fitness journey today</p>

            <!-- handleSignup() is defined in script.js -->
            <form id="signup-form" onsubmit="return handleSignup(event)">

                <!-- Username -->
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Choose a username" required>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Create a password" required>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password"
                           placeholder="Re-enter your password" required>
                    <!-- This error message appears if the passwords don't match -->
                    <span id="password-match-error" class="error-msg">
                        Passwords do not match
                    </span>
                </div>

                <!-- Terms Checkbox -->
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the <a href="#">Terms &amp; Conditions</a> and
                        <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>

                <div class="auth-footer">
                    <span>Already a member?</span>
                    <a href="login.html">Log In</a>
                </div>

            </form>
        </div>
    </main>

    <script>
        // ── Real-time password match feedback ──────────────────────────
        // As the user types in the "Confirm Password" field,
        // show or hide the error message instantly.
        document.getElementById("confirm-password").addEventListener("input", function () {
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("password-match-error");
            // Show the error only if the field has a value AND it doesn't match
            if (this.value && this.value !== password) {
                errorMsg.style.display = "block";
            } else {
                errorMsg.style.display = "none";
            }
        });
    </script>

    <script src="auth-guard.js"></script>
    <script src="script.js"></script>
</body>
</html>
